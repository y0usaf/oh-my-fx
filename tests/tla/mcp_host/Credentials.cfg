\* Smoke: two servers, any starting document, note and v1 store, and every fault: unreadable, readable again, deleted, a v1 sign-in.
CONSTANTS
    Names = {"s", "t"}
    Faults = {"unreadable", "repair", "delete", "v1login"}
    InitKinds = {"absent", "ok", "unreadable"}
    InitEntries = {"s", "t"}
    InitImported = {FALSE, TRUE}
    InitMarked = {FALSE, TRUE}
    InitV1 = {"s", "t"}
SPECIFICATION Spec
\* The specific properties first: TLC names the first one a state breaks.
INVARIANTS
    TypeOK
    ImportOnce
    SignedInKept
    UnreadableNeverOverwritten
    NoLogoutUndoneByImport
    LogoutStays
