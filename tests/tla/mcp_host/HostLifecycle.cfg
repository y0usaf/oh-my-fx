\* Smoke: one profile server, one project server that never answers; three hosts.
CONSTANTS
    Servers = {"a", "p"}
    Project = {"p"}
    Reachable = {"a"}
    NeedsAuth = {}
    MaxHosts = 3
    MaxLeases = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    HeldNeverSpawned
    StartedAfterFirstFrame
    RefreshedLineAgrees
    QuitSignalsEveryServer
    RemovedNotRunning
    OneProcessPerServer
PROPERTIES
    ApprovedServersSettle
    EveryStopEnds
