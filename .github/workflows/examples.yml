name: Examples

on:
  pull_request:
    paths:
      - 'examples/**'
      - '.github/workflows/examples.yml'
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - '.github/workflows/examples.yml'

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        example: [node-chat, browser-agent, nextjs-agent, nuxt-agent]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/${{ matrix.example }}/package-lock.json
      - run: npm ci
      - if: matrix.example == 'node-chat'
        run: node --test ../shared/*.test.mjs
      - if: matrix.example == 'browser-agent'
        run: node --experimental-vm-modules --test main.test.mjs
      - if: matrix.example == 'nuxt-agent'
        run: node --test dev.test.mjs
      - if: matrix.example != 'node-chat'
        run: npm run build
