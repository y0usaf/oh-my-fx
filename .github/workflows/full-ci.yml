name: Full CI

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main

concurrency:
  group: full-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  native:
    name: Native checks (${{ matrix.optimize }}, ${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-x86_64
            runner: macos-15-intel
          - name: macos-aarch64
            runner: macos-15
        optimize: [ReleaseSafe]
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          cache-key: full-ci-native-${{ matrix.platform.name }}-${{ matrix.optimize }}

      - name: Check formatting
        run: zig fmt --check src/

      - name: Audit public surface
        run: ./scripts/check-public-surface.sh

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Smoke check binary
        shell: bash
        run: |
          help_stdout="$(mktemp)"
          help_stderr="$(mktemp)"
          status_stdout="$(mktemp)"
          status_stderr="$(mktemp)"
          trap 'rm -f "$help_stdout" "$help_stderr" "$status_stdout" "$status_stderr"' EXIT

          ./zig-out/bin/omfx help >"$help_stdout" 2>"$help_stderr"
          test -s "$help_stdout"
          test ! -s "$help_stderr"

          ./zig-out/bin/omfx status --json >"$status_stdout" 2>"$status_stderr"
          test -s "$status_stdout"
          test ! -s "$status_stderr"

  full-suite:
    name: Full suite (${{ matrix.name }})
    if: ${{ always() }}
    needs:
      - native
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        name:
          - linux-x86_64
          - linux-aarch64
          - macos-x86_64
          - macos-aarch64
    steps:
      - name: Verify native matrix
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.name }}
        run: |
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100")"
          jq -e --arg target "$TARGET" '
            [
              .jobs[]
              | select(.name == "Native checks (ReleaseSafe, " + $target + ")")
            ] as $selected
            | (($selected | length) == 1 and
               all($selected[]; .conclusion == "success"))
          ' <<< "$jobs"
